name: Generate detection reports

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python development/toml_to_report.py --output-dir .ci-reports
      - run: python development/toml_to_md.py --output-dir .ci-reports
      - run: python development/toml_to_csv.py --output-dir .ci-reports
      - run: python development/toml_to_navigator.py --output-dir .ci-reports
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: detection-reports
          path: .ci-reports/
          if-no-files-found: error
