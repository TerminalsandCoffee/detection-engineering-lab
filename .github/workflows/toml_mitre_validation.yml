name: Validate detection lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      online_mitre:
        description: Also check all TOML mappings against the current official ATT&CK catalog
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python development/validation.py
      - run: python development/toml_to_json.py --dry-run
      - run: python development/toml_to_csv.py --output-dir .ci-reports
      - run: python development/toml_to_navigator.py --output-dir .ci-reports
      - run: python development/toml_to_report.py --output-dir .ci-reports
      - run: python development/toml_to_md.py --output-dir .ci-reports

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: setup/terraform
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  native-wazuh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: bash tests/wazuh_logtest.sh

  online-mitre:
    if: github.event_name == 'workflow_dispatch' && inputs.online_mitre
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python development/mitre.py
