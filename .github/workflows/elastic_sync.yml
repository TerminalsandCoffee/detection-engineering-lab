name: Preview changed Elastic payloads

on:
  workflow_dispatch:
    inputs:
      changed_files:
        description: Repository paths separated by spaces or commas, or a JSON array
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python development/update_alert.py --dry-run
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
