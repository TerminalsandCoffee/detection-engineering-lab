[metadata]
creation_date = "2023/12/11"
updated_date = "2026/09/06"

[rule]
author = ["Anthony Isherwood"]
description = "Flags at least 1000 Zeek HTTP events grouped by source.ip over the six-minute lookback. Events may span multiple destinations. Browsing, monitoring, and load tests can match; inspect destinations and request behavior before treating this as discovery activity."
from = "now-6m"
name = "Excessive Web Traffic"
risk_score = 25
severity = "low"
type = "threshold"
language = "kuery"
rule_id = "00000000-0000-0000-0000-000000000004"
query = '''
event.dataset : "zeek.http"
'''

[rule.threshold]
field = ["source.ip"]
value = 1000

[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1046"
name = "Network Service Discovery"
reference = "https://attack.mitre.org/techniques/T1046/"

[rule.threat.tactic]
id = "TA0007"
name = "Discovery"
reference = "https://attack.mitre.org/tactics/TA0007/"

